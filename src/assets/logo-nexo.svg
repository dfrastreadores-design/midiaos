<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="nexoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Simbolo Geometrico Nexo (Conexão / Telas) -->
  <g transform="translate(15, 12)">
    <!-- Fundo do ícone -->
    <rect x="0" y="0" width="66" height="66" rx="16" fill="url(#nexoGrad)" filter="url(#shadow)" />
    <!-- Marca interna N estilizado / Conexões -->
    <path d="M19 47 V19 L33 33 L47 19 V47" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ponto de brilho / conexão -->
    <circle cx="33" cy="33" r="3.5" fill="#22D3EE"/>
  </g>

  <!-- Tipografia NEXO -->
  <text x="96" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#FFFFFF">NEXO</text>
  
  <!-- Subtítulo MÍDIA & OOH -->
  <text x="98" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#38BDF8">MÍDIA INTELIGENTE</text>
</svg>
