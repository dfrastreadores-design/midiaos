name: Deploy Automático Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚡ Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Instalar dependências
        run: bun install

      - name: 🏗️ Compilar projeto para produção
        run: bun run build

      - name: 📂 Preparar arquivos de deploy
        run: |
          mkdir -p hostinger
          cp -r .output hostinger/
          cp hostinger.mjs hostinger/
          cp package.json hostinger/

      - name: 🚀 Upload FTP para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./hostinger/
          server-dir: /public_html/
