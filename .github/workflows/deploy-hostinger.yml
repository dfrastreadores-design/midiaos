name: Deploy Automático Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚡ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🚀 Executar deploy automático na Hostinger
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: node scripts/deploy-hostinger.mjs
